services:
  - type: web
    name: gymbro-statistics-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_MODE
        value: require
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: AI_SERVICE_URL
        value: https://gymbro-ai-service.onrender.com
      - key: TELEGRAM_SERVICE_URL
        sync: false
